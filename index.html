<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0B0D13;--bg-2:#11141C;
  --card:rgba(255,255,255,.045);--card-hi:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.08);--line-hi:rgba(255,255,255,.16);
  --text:#EAECF2;--text-2:#A2A9B8;--text-3:#6E7686;
  --brand:#7B8CFF;--brand-2:#B06BFF;
  --brand-rgb:123,140,255;--brand2-rgb:176,107,255;
  --grad:linear-gradient(135deg,var(--brand),var(--brand-2));
  --out:#FF6B6B;--in:#35D99B;--pink:#FF7BB0;--amber:#FFB454;--cyan:#4FD1E0;
  --r:18px;--r-sm:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}

/* ===== 主题（个性化：覆盖品牌色，其余层级保持不变） ===== */
[data-theme="aurora"]{--brand:#7B8CFF;--brand-2:#B06BFF;--brand-rgb:123,140,255;--brand2-rgb:176,107,255}
[data-theme="ocean"] {--brand:#5AA9FF;--brand-2:#2E6BF6;--brand-rgb:90,169,255;--brand2-rgb:46,107,246}
[data-theme="peach"] {--brand:#FF8FA3;--brand-2:#FF6FB5;--brand-rgb:255,143,163;--brand2-rgb:255,111,181}
[data-theme="forest"]{--brand:#5BE095;--brand-2:#22C3A6;--brand-rgb:91,224,149;--brand2-rgb:34,195,166}
[data-theme="sunset"]{--brand:#FFB454;--brand-2:#FF7A59;--brand-rgb:255,180,84;--brand2-rgb:255,122,89}
[data-theme="ink"]   {--brand:#A9B2C2;--brand-2:#6E7686;--brand-rgb:169,178,194;--brand2-rgb:110,118,134}

/* ===== 个性化设置控件 ===== */
.theme-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.theme-dot{aspect-ratio:1;border-radius:14px;border:2px solid transparent;transition:transform .16s,border-color .16s}
.theme-dot.on{border-color:#fff}
.theme-dot:active{transform:scale(.93)}
.cat-edit{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cat-x{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;background:rgba(255,255,255,.07);border-radius:9px;font-size:12px;color:var(--text-2)}
.cat-x em{font-style:normal;color:var(--text-3);font-size:15px;line-height:1}

/* ===== 月份切换 ===== */
.month-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.month-nav{width:44px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:17px;flex:0 0 auto}
.month-nav:active{background:var(--card-hi)}
.month-nav:disabled{opacity:.28}
.month-cur{flex:1;text-align:center;font-size:15px;font-weight:700}

/* ===== 降低动效偏好（系统开启时关闭动画） ===== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(880px 520px at 12% -8%, rgba(var(--brand-rgb),.14), transparent 62%),
    radial-gradient(700px 420px at 105% 2%, rgba(var(--brand2-rgb),.11), transparent 58%);
  background-attachment:fixed;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
select option{background:#161A24;color:var(--text)}
a{color:var(--brand);text-decoration:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#root{min-height:100%}

/* ===== Header ===== */
.hd{
  position:sticky;top:var(--neth,0px);z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(var(--safe-top) + 13px) 18px 12px;
  background:rgba(11,13,19,.72);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--line);
}
/* 断网提示条：放在 #root 外面（登录页也要有），sticky 粘顶。
   它出现时 .hd 要用 --neth 让位 —— 两个元素都是 sticky top:0，不抬一手会互相压住。
   高度由 JS 实测写入（横条高度随安全区变），别在 CSS 里猜。 */
.net-bar{
  position:sticky;top:0;z-index:30;display:none;
  align-items:center;justify-content:center;gap:7px;
  padding:calc(var(--safe-top) + 8px) 14px 8px;
  background:linear-gradient(135deg,var(--amber),#F0913C);color:#241703;
  font-size:12.5px;font-weight:700;letter-spacing:.01em;
}
.net-bar.on{display:flex}

.brand{font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand.hi{line-height:1.25}
.brand .hi-t{display:block;font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:.02em}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:14px;flex:0 0 auto;
  box-shadow:0 4px 14px rgba(var(--brand-rgb),.3);
}
.avatar:active{transform:scale(.93)}
.avatar svg{width:19px;height:19px;stroke-width:2}
/* 自定义头像：图片铺满圆形，皮肤立绘按脸部位置取景 */
.avatar,.me-avatar{overflow:hidden}
.av-img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.av-img.skin{object-position:50% 20%}
.view{flex:1;padding:16px 16px calc(146px + var(--safe-bottom));max-width:680px;margin:0 auto;width:100%}
.view>*{animation:fade .26s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== Tab bar ===== */
.tab-bar{
  position:fixed;bottom:0;left:0;right:0;display:flex;
  background:rgba(11,13,19,.82);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-bottom));z-index:20;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--text-3);font-size:10.5px;transition:color .18s}
.tab .pill{width:44px;height:27px;border-radius:14px;display:flex;align-items:center;justify-content:center;transition:background .18s}
.tab svg{width:21px;height:21px;stroke-width:1.7}
.tab.active{color:#fff}
.tab.active .pill{background:rgba(var(--brand-rgb),.18)}
.tab:active .pill{background:rgba(255,255,255,.07)}

/* ===== Login ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{
  width:100%;max-width:390px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:24px;padding:30px 24px 26px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 24px 60px rgba(0,0,0,.45);
}
.login-logo{
  width:56px;height:56px;border-radius:18px;background:var(--grad);margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(var(--brand-rgb),.35);
}
.login-logo svg{width:26px;height:26px;stroke:#fff;stroke-width:7;stroke-linecap:round}
.login-title{font-size:23px;font-weight:700;text-align:center;letter-spacing:-.02em}
.login-sub{color:var(--text-3);font-size:13px;text-align:center;margin-top:5px;margin-bottom:24px}
.login-tabs{display:flex;background:rgba(255,255,255,.05);border-radius:12px;padding:4px;margin-bottom:20px;gap:2px}
.login-tab{flex:1;padding:8px 4px;border-radius:9px;color:var(--text-3);font-size:13px;text-align:center;transition:.18s}
.login-tab.active{background:rgba(255,255,255,.09);color:#fff;font-weight:600}

/* ===== Form ===== */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text-3);margin-bottom:7px;padding-left:2px}
.inp,.field input,.field textarea,.field select{
  width:100%;padding:13px 14px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:13px;font-size:15px;transition:.16s;
}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:rgba(var(--brand-rgb),.55);background:rgba(var(--brand-rgb),.07);
}
.field textarea{resize:vertical;min-height:88px;line-height:1.6}
/* 正文够长才写得舒服：起步就 8 行左右，写多了自己往上长（上限半屏，再多就内部滚动） */
.field textarea.grow{min-height:158px;resize:none;overflow:hidden}
.field-row{display:flex;gap:10px;align-items:flex-end}
.field-row .field{flex:1;min-width:0}
.btn{
  width:100%;padding:14px;border-radius:14px;background:var(--grad);color:#fff;
  font-weight:600;font-size:15px;box-shadow:0 8px 22px rgba(var(--brand-rgb),.28);
  transition:transform .12s,opacity .12s;margin-top:4px;
}
.btn:active{transform:scale(.985);opacity:.9}
.btn:disabled{opacity:.55;box-shadow:none}
.btn-ghost{
  width:100%;padding:13px;border-radius:14px;border:1px solid var(--line-hi);
  color:var(--text-2);font-size:15px;background:rgba(255,255,255,.03);margin-top:10px;
}
.btn-ghost.danger{color:var(--out);border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.06)}
.btn-text{padding:8px;color:var(--text-3);font-size:13px}
.btn-text:active{color:var(--text)}
.btn-code{
  padding:13px 15px;background:rgba(255,255,255,.06);border:1px solid var(--line-hi);
  border-radius:13px;color:var(--brand);font-size:13px;white-space:nowrap;flex:0 0 auto;margin-bottom:14px;
}
.btn-code:disabled{color:var(--text-3);cursor:not-allowed}
.msg{margin-top:12px;padding:11px 13px;border-radius:11px;font-size:13px;display:none;line-height:1.5}
.msg.show{display:block}
.msg.err{background:rgba(255,107,107,.13);color:#FFB3B3;border:1px solid rgba(255,107,107,.22)}
.msg.ok{background:rgba(53,217,155,.13);color:#8DF0C6;border:1px solid rgba(53,217,155,.22)}

/* ===== Section / Card ===== */
.sec{font-size:12px;color:var(--text-3);margin:20px 2px 10px;font-weight:600;letter-spacing:.03em}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;margin-bottom:10px;
}
.card-tap:active{background:var(--card-hi)}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.amt-out{color:var(--out);font-weight:700;font-size:17px}
.amt-in{color:var(--in);font-weight:700;font-size:17px}
.muted{color:var(--text-3)}
.dim{color:var(--text-2)}
.tag{display:inline-block;padding:3px 9px;background:rgba(255,255,255,.07);border-radius:8px;font-size:11px;color:var(--text-2);margin:0 5px 5px 0}
.mood{font-size:19px;margin-right:6px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600}

/* ===== Hero (今日) ===== */
.hero{
  background:linear-gradient(140deg, rgba(var(--brand-rgb),.24), rgba(var(--brand2-rgb),.10) 60%, rgba(255,255,255,.04));
  border:1px solid rgba(var(--brand-rgb),.26);border-radius:22px;padding:20px 20px 18px;margin-bottom:6px;
}
.hero-label{font-size:12px;color:rgba(234,236,242,.72);letter-spacing:.04em}
.hero-num{font-size:36px;font-weight:800;letter-spacing:-.03em;margin:4px 0 14px;color:#fff}
.hero-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px 8px;border-top:1px solid rgba(255,255,255,.12);padding-top:13px}
.hero-grid .k{display:block;font-size:11px;color:var(--text-3);margin-bottom:2px}
.hero-grid .v{font-size:15px;font-weight:700}

/* ===== Stats ===== */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.stat .label{font-size:12px;color:var(--text-3)}
.stat .value{font-size:21px;font-weight:700;margin-top:3px;letter-spacing:-.01em}
.stat .sub{font-size:11px;color:var(--text-3);margin-top:1px}

/* ===== Check-in (今日状态) ===== */
.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.check{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;text-align:center}
.check .ico{font-size:20px;display:block;margin-bottom:5px}
.check .ico svg{width:21px;height:21px;display:block;margin:0 auto 6px;color:var(--text-3);stroke-width:1.8}
.check.on .ico svg{color:var(--in)}
.check .t{font-size:11px;color:var(--text-3);margin-bottom:3px}
.check .v{font-size:14px;font-weight:700}
.check.on{border-color:rgba(53,217,155,.35);background:rgba(53,217,155,.09)}
.check.on .v{color:var(--in)}
.check.off .v{color:var(--text-3)}

/* ===== Quick ===== */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.quick{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 4px;text-align:center;color:var(--text-2);font-size:11px;transition:.14s;
}
.quick:active{background:var(--card-hi);transform:scale(.97)}
.quick .ico{width:24px;height:24px;display:block;margin:0 auto 6px;color:var(--brand)}
.quick svg{width:24px;height:24px;display:block;margin:0 auto 7px;color:var(--brand);stroke-width:1.8}

/* ===== FAB ===== */
.fab{
  position:fixed;right:17px;bottom:calc(78px + var(--safe-bottom));
  width:52px;height:52px;border-radius:17px;background:var(--grad);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(var(--brand-rgb),.36);z-index:15;transition:transform .12s;
}
.fab svg{width:24px;height:24px;stroke-width:2.2}
.fab:active{transform:scale(.92)}

/* ===== Modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:40;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{
  width:100%;max-width:680px;background:#14171F;
  border-top-left-radius:24px;border-top-right-radius:24px;border:1px solid var(--line);
  padding:8px 18px calc(20px + var(--safe-bottom) + var(--kb,0px));
  max-height:calc(92vh - var(--kb,0px));overflow-y:auto;animation:slideUp .26s cubic-bezier(.2,.8,.3,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 0 14px}
.modal-title{font-size:17px;font-weight:700}
.btn-close{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.07);color:var(--text-2);font-size:17px;display:flex;align-items:center;justify-content:center}
.grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:8px auto 0}

/* ===== Charts ===== */
.chart-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 8px;margin-bottom:6px}
.chart-title{font-size:12px;color:var(--text-3);margin:0 4px 8px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-variant-numeric:tabular-nums}
.chart-legend{display:flex;gap:16px;justify-content:center;margin-top:4px;font-size:11px;color:var(--text-3)}
.chart-legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}
.bar-stack{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:58px 1fr 66px;align-items:center;gap:9px;font-size:12px}
.bar-track{height:9px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
.bar-fill{height:100%;border-radius:5px;background:var(--grad)}
.bar-row .nm{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .vl{text-align:right;color:var(--text-2);font-variant-numeric:tabular-nums;font-size:11px}

/* ===== Segmented control ===== */
.seg{display:flex;gap:4px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;color:var(--text-2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--grad);color:#fff}
.seg button svg{width:15px;height:15px}

/* ===== Streak / 徽章 ===== */
.streak{display:flex;align-items:center;gap:13px;background:linear-gradient(135deg,rgba(255,180,84,.16),rgba(255,122,89,.06));border:1px solid rgba(255,180,84,.28);border-radius:var(--r);padding:14px 16px;margin-bottom:6px}
.streak .flame{color:var(--amber);flex:0 0 auto}
.streak .flame svg{width:27px;height:27px;stroke-width:1.7;display:block}
.streak .big{font-size:25px;font-weight:800;color:var(--amber);letter-spacing:-.02em;line-height:1.1}
.streak .lb{font-size:11px;color:var(--text-3);margin-top:1px}
.streak .side{margin-left:auto;text-align:right;font-size:11px;color:var(--text-3);line-height:1.65}
.badge-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.badge{text-align:center;padding:11px 2px;border-radius:14px;background:var(--card);border:1px solid var(--line);opacity:.34}
.badge.got{opacity:1;border-color:rgba(255,180,84,.42);background:rgba(255,180,84,.11)}
.badge .n{font-size:16px;font-weight:800;color:var(--amber);letter-spacing:-.02em}
.badge .d{font-size:9px;color:var(--text-3);margin-top:2px}

/* ===== Search ===== */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding-left:36px;padding-right:34px}
.search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-3);pointer-events:none}
.search .si svg{width:100%;height:100%;display:block}
.search .clr{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--text-3);font-size:13px;display:flex;align-items:center;justify-content:center}
mark{background:rgba(255,180,84,.3);color:#fff;border-radius:3px;padding:0 2px}

/* ===== Steps ===== */
.step-hero{background:linear-gradient(140deg,rgba(79,209,224,.2),rgba(91,224,149,.07) 60%,rgba(255,255,255,.04));border:1px solid rgba(79,209,224,.26);border-radius:22px;padding:17px 20px 16px;margin-bottom:6px;transition:transform .12s}
.step-hero:active{transform:scale(.99)}
.step-top{display:flex;align-items:baseline;justify-content:space-between}
.step-num{font-size:33px;font-weight:800;letter-spacing:-.03em;color:#fff}
.step-track{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:11px}
.step-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--in))}
.step-hint{font-size:11px;color:var(--text-3);margin-top:7px;line-height:1.6}
.step-calib{margin-top:8px;border-top:1px solid rgba(255,255,255,.09);padding-top:7px}
.step-calib .btn-text{padding:0;font-size:11.5px;color:var(--cyan)}
/* 步数卡里的「距离 / 消耗」—— 按步数折算出来的，UI 上必须写明是估算 */
.step-extra{display:flex;align-items:flex-end;gap:26px;margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.09)}
.step-extra .m{display:flex;flex-direction:column;gap:3px}
.step-extra .m i{font-style:normal;font-size:11px;color:var(--text-3)}
.step-extra .m b{font-size:16px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.1}
.step-extra .m b em{font-style:normal;font-size:11px;font-weight:600;color:var(--text-3);margin-left:3px}
.step-extra .adj{margin-left:auto}
.step-extra .adj .btn-text{padding:0;font-size:11.5px;color:var(--cyan)}

/* ===== 宠物 / 签到 ===== */
.pet-card{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,rgba(255,123,176,.17),rgba(var(--brand-rgb),.08) 62%,rgba(255,255,255,.03));
  border:1px solid rgba(255,123,176,.28);border-radius:22px;padding:13px 16px 14px;margin-bottom:6px;
  transition:transform .12s
}
.pet-card:active{transform:scale(.99)}
.pet-stage{position:relative;flex:0 0 auto;width:100px;height:100px;display:flex;align-items:center;justify-content:center}
.pet-stage::before{
  content:'';position:absolute;inset:-8px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,140,190,.4),rgba(255,140,190,0) 68%);
  animation:breathe 3.6s ease-in-out infinite
}
.pet-img{position:relative;width:100%;height:100%;object-fit:contain;animation:float 3.8s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(255,110,165,.34))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes breathe{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
.pet-info{flex:1;min-width:0}
.pet-head{display:flex;align-items:center;gap:7px}
.pet-name{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-chip{flex:0 0 auto;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,123,176,.22);color:var(--pink)}
.pet-sub{font-size:11px;color:var(--text-3);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.pet-sub b{color:var(--pink);font-weight:700}
.exp-track{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:9px}
.exp-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#FF9EC4,#FF6FA8);transition:width .6s cubic-bezier(.2,.9,.3,1)}
.pet-tip{font-size:10.5px;color:var(--text-3);margin-top:6px}
/* 宠物卡上的换装入口 */
.pet-dress{margin-left:auto;flex:0 0 auto;font-size:10px;font-weight:600;color:var(--pink);background:rgba(255,123,176,.14);border:1px solid rgba(255,123,176,.32);border-radius:99px;padding:2px 9px;line-height:1.5}
.pet-dress:active{background:rgba(255,123,176,.26)}
/* 换皮光晕：跟着皮肤换色调 */
.pet-stage.skin-xinghong::before{background:radial-gradient(circle,rgba(255,168,205,.46),rgba(255,168,205,0) 68%)}
.pet-stage.skin-xingshi::before{background:radial-gradient(circle,rgba(158,126,255,.44),rgba(158,126,255,0) 68%)}
.pet-stage.skin-wedding::before{background:radial-gradient(circle,rgba(186,214,255,.44),rgba(186,214,255,0) 68%)}
/* 换装选择 */
.skins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.skin{border-radius:16px;background:var(--card);border:1px solid var(--line);padding:10px 4px 9px;text-align:center;opacity:.5;transition:opacity .16s,border-color .16s,background .16s}
.skin img{width:100%;height:84px;object-fit:contain;display:block}
.skin .sn{font-size:11px;color:var(--text-2);margin-top:5px;font-weight:600;letter-spacing:-.01em}
.skin .st{font-size:9px;color:var(--text-3);margin-top:2px}
.skin.on{opacity:1;border-color:rgba(255,123,176,.5);background:rgba(255,123,176,.1)}
.skin.on .sn{color:var(--pink)}

/* 签到日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:11px}
.cal .d{aspect-ratio:1;border-radius:9px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--text-3);border:1px solid transparent}
.cal .d.on{background:linear-gradient(135deg,#FF9EC4,#FF6FA8);color:#fff;font-weight:700}
.cal .d.today{border-color:rgba(255,158,196,.85)}
.cal .d.mute{opacity:.35}

/* 进化路线 */
.evo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px}
.evo .e{text-align:center;padding:9px 2px 7px;border-radius:15px;background:var(--card);border:1px solid var(--line);opacity:.38}
.evo .e.got{opacity:1;border-color:rgba(255,123,176,.42);background:rgba(255,123,176,.1)}
.evo .e img{width:46px;height:46px;object-fit:contain;display:block;margin:0 auto 5px}
.evo .e .n{font-size:9.5px;color:var(--text-3);line-height:1.35}
.evo .e.got .n{color:var(--pink);font-weight:600}

/* Toast
   ⭐ 收起位必须"几何上一定出屏"：旧写法是 top:66px+safe-top 配 translateY(-190%)，
   而 toast 有两三行（标题 + 换行后的说明）时高度约 68px，-190% 只上移 129px，
   顶部起点又是 66px + 安全区 ⇒ 底部还剩三四十像素留在屏幕最顶端，
   变成一条挂在状态栏上、只有刷新页面才会消失的"胶囊"（还正好挡住状态栏）。
   现在改成 top:0 + translateY(calc(-100% - 24px))：无论自身多高、安全区多大都在屏外；
   再加 visibility/pointer-events —— 光靠 opacity 是挡不住点击的。 */
.toast{
  position:fixed;left:50%;top:0;transform:translate(-50%,calc(-100% - 24px));
  opacity:0;visibility:hidden;pointer-events:none;
  background:rgba(26,20,32,.97);border:1px solid rgba(255,123,176,.38);color:#fff;
  padding:10px 17px 10px 13px;border-radius:99px;font-size:13px;font-weight:600;z-index:120;
  box-shadow:0 14px 34px rgba(0,0,0,.5);
  transition:transform .34s cubic-bezier(.2,.9,.3,1),opacity .2s ease,visibility .34s;
  display:flex;align-items:center;gap:9px;max-width:92vw
}
.toast.show{transform:translate(-50%,calc(var(--safe-top) + 66px));opacity:1;visibility:visible;pointer-events:auto}
/* 出错提示：红描边 + 叹号，别和「签到成功 +20 经验」那种带宠物头像的鼓励提示混在一起 */
.toast.err{border-color:rgba(255,107,107,.55)}
.toast .ti{
  width:23px;height:23px;border-radius:50%;flex:0 0 auto;
  background:var(--out);color:#210808;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;line-height:1
}
.toast img{width:26px;height:26px;object-fit:contain;flex:0 0 auto}
.toast .tt{line-height:1.35}
.toast .tt i{display:block;font-style:normal;font-size:10.5px;color:var(--text-3);font-weight:500;margin-top:1px}
/* 自动同步结果条：手机端自动化打开本页（?steps=…&a=1）时显示，一眼就能看到结果 */
/* 收起位同样用 translateY(-100% - 30px)：只要 top 参与定位，安全区一大就可能漏一条在屏顶 */
.sync-bar{
  position:fixed;left:14px;right:14px;top:0;z-index:70;
  display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:17px;
  color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 12px 30px rgba(0,0,0,.42);
  font-size:13.5px;font-weight:700;line-height:1.4;
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(calc(-100% - 30px));
  transition:opacity .26s,transform .3s cubic-bezier(.2,.8,.3,1),visibility .3s;
}
.sync-bar.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(calc(var(--safe-top) + 10px))}
.sync-bar .ico{width:28px;height:28px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.24)}
.sync-bar .ico svg{width:17px;height:17px}
.sync-bar i{display:block;font-style:normal;font-size:11px;font-weight:500;opacity:.88;margin-top:2px}

/* ===== Empty / Loader ===== */
.empty{text-align:center;padding:52px 16px;color:var(--text-3);font-size:13px;line-height:1.7}
.empty .ico{font-size:40px;margin-bottom:12px;opacity:.5}
.loader{display:inline-block;width:15px;height:15px;border:2px solid var(--line-hi);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Profile (我的) ===== */
.me-hero{text-align:center;padding:26px 16px 22px}
.me-avatar{
  width:72px;height:72px;border-radius:50%;background:var(--grad);margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:700;
  box-shadow:0 12px 32px rgba(var(--brand-rgb),.35);
}
.me-avatar svg{width:34px;height:34px;stroke-width:1.9}
.me-avatar:active{transform:scale(.95)}
.me-avatar{cursor:pointer;transition:transform .16s}
/* 头像选择器 */
.av-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 2px}
.av-opt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px 9px;text-align:center;transition:border-color .16s,background .16s}
.av-opt.on{border-color:var(--brand);background:rgba(var(--brand-rgb),.1)}
.av-opt.on .av-name{color:var(--brand)}
.av-thumb{width:52px;height:52px;margin:0 auto 7px;border-radius:50%;overflow:hidden;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff}
.av-thumb svg{width:24px;height:24px;stroke-width:2}
.av-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.av-name{font-size:11.5px;color:var(--text-2);line-height:1.3}
/* 文件选择：把透明 input 铺满整块按钮区域。
   用户点到的一定是 file 控件本身 = 浏览器眼中的"真用户手势"，
   WebView / 微信里才不会因为「JS 调的 click() 没有用户激活」而静默失效。
   注意 ⛔ 不能用 display:none —— 隐藏掉的 input 点了不弹选择器。 */
.file-pick{position:relative;overflow:hidden;display:block;cursor:pointer}
.file-pick>input[type=file]{
  position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
/* ===== 标签选择器（随手记）===== */
.tagpick{display:flex;flex-wrap:wrap;gap:8px}
.tchip{
  padding:8px 13px;border-radius:11px;border:1px solid var(--line-hi);
  background:rgba(255,255,255,.04);color:var(--text-2);font-size:13px;line-height:1.2;transition:.15s;
}
.tchip.on{background:rgba(var(--brand-rgb),.18);border-color:rgba(var(--brand-rgb),.6);color:#fff;font-weight:600}
.tchip.add{border-style:dashed;color:var(--brand)}
.tchip.mgr{border-style:dashed;color:var(--text-3)}
.tchip.mgr.on{background:rgba(255,107,107,.16);border-color:rgba(255,107,107,.5);border-style:solid;color:#fff}
/* 管理态：每个标签里长出一个小 ×（只从"候选池"里去掉，历史记录不动） */
.tchip{position:relative}
.tagpick.mgr .tchip:not(.add):not(.mgr){padding-right:29px}
.tagpick.mgr .tchip.on{opacity:.75}
.tchip .tx{
  display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;border-radius:50%;background:var(--out);color:#fff;
  font-size:11px;line-height:16px;text-align:center;font-style:normal;font-weight:700;
}
.tagpick.mgr .tchip .tx{display:block}
.taghint{display:none;font-size:11.5px;color:var(--text-3);margin-top:9px;line-height:1.6}
.taghint.show{display:block}
.tagnew{display:none;gap:8px;margin-top:10px;align-items:center}
.tagnew.show{display:flex}
.tagnew input{flex:1;min-width:0}
.tagnew button{
  padding:13px 16px;border-radius:13px;background:var(--grad);color:#fff;
  font-size:13px;font-weight:600;flex:0 0 auto;
}
/* 列表页标签筛选条 */
.tagbar{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.tagbar::-webkit-scrollbar{display:none}
.filter{
  flex:0 0 auto;padding:7px 13px;border-radius:99px;border:1px solid var(--line-hi);
  font-size:12px;color:var(--text-2);background:rgba(255,255,255,.03);transition:.15s;
}
.filter.on{background:rgba(var(--brand-rgb),.2);border-color:rgba(var(--brand-rgb),.55);color:#fff;font-weight:600}
/* 同步说明里的步骤与代码 */
.sy-ver{
  font-size:12.5px;color:var(--text-2);background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin:2px 0 12px;
}
.sy-steps{margin:0;padding-left:20px;font-size:12.5px;line-height:1.75;color:var(--text-2)}
.sy-steps li{margin-bottom:4px}
.sy-steps b{color:var(--text)}
.sy-steps code{background:rgba(127,127,127,.16);padding:1px 5px;border-radius:5px;font-size:11.5px;word-break:break-all}
/* 步数同步说明页 */
.sy-t{display:block;font-size:13px;font-weight:700;color:var(--text);margin:17px 0 7px}
.sy-t em{font-style:normal;display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--grad);color:#fff;font-size:11.5px;align-items:center;justify-content:center;margin-right:7px;vertical-align:2px}
.sy-p{font-size:12.5px;line-height:1.85;color:var(--text-2);margin:0 0 5px}
.sy-p b{color:var(--text)}
.sy-p .k{background:rgba(127,127,127,.16);padding:1px 6px;border-radius:5px;font-size:11.5px;color:var(--text)}
.sy-p a{color:var(--brand-2);font-weight:700;text-decoration:none}
.sy-url{font-size:11.5px;word-break:break-all}
.me-email{font-size:16px;font-weight:600;word-break:break-all}
.me-meta{font-size:12px;color:var(--text-3);margin-top:5px}
.me-list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.me-item{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line)}
.me-item:last-child{border-bottom:none}
.me-item:active{background:var(--card-hi)}
.me-ico{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:15px}
.me-ico svg{width:17px;height:17px}
.me-txt{flex:1;min-width:0}
.me-txt .t{font-size:14.5px}
.me-txt .s{font-size:11.5px;color:var(--text-3);margin-top:1px}
.me-arrow{color:var(--text-3);font-size:15px}
.me-count{font-size:13px;font-weight:700;color:var(--brand)}
.note{font-size:11.5px;color:var(--text-3);text-align:center;padding:6px 20px 0;line-height:1.7}
hr.div{border:none;border-top:1px solid var(--line);margin:14px 0}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:600;background:rgba(var(--brand-rgb),.16);color:var(--brand)}

/* ===== 每周回顾 ===== */
.wk-back{display:flex;align-items:center;gap:6px;width:fit-content;margin-bottom:14px;padding:7px 13px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;color:var(--text-2);font-size:12.5px}
.wk-nav{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.wk-nav .rg{flex:1;text-align:center;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.wk-nav .rg em{font-style:normal;font-size:11px;font-weight:600;color:var(--text-3);margin-left:6px}
.wk-nav button{width:33px;height:33px;flex:0 0 auto;border-radius:11px;background:var(--card);border:1px solid var(--line);
  color:var(--text-2);font-size:16px;display:flex;align-items:center;justify-content:center}
.wk-nav button:disabled{opacity:.3}
.wk-hero{background:linear-gradient(140deg,rgba(var(--brand-rgb),.24),rgba(var(--brand2-rgb),.10) 60%,rgba(255,255,255,.04));
  border:1px solid rgba(var(--brand-rgb),.26);border-radius:22px;padding:18px 18px 16px}
.wk-hero .lbl{font-size:12px;color:rgba(234,236,242,.72);letter-spacing:.03em}
.wk-hero .big{font-size:31px;font-weight:800;letter-spacing:-.03em;color:#fff;margin:3px 0 13px}
.wk-hero .g{display:grid;grid-template-columns:repeat(2,1fr);gap:11px 8px;
  border-top:1px solid rgba(255,255,255,.12);padding-top:13px}
.wk-hero .g .k{display:block;font-size:11px;color:rgba(234,236,242,.6);margin-bottom:2px}
.wk-hero .g .v{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.wk-delta{font-weight:700}
.wk-up{color:var(--out)}.wk-dn{color:var(--in)}.wk-flat{color:var(--text-3)}
.nr{display:inline-block;font-size:11.5px;font-weight:600;color:var(--amber);
  background:rgba(255,180,84,.11);border:1px solid rgba(255,180,84,.3);border-radius:8px;padding:2px 8px}
.st-tb{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.st-tb th,.st-tb td{padding:7px 5px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.st-tb th:first-child,.st-tb td:first-child{text-align:left}
.st-tb thead th{font-size:11px;color:var(--text-3);font-weight:600}
.st-tb tbody tr:last-child td{border-bottom:none;font-weight:700}
.wk-days{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.wk-day{font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--text-2)}
.wk-day.on{border-color:rgba(var(--brand-rgb),.5);background:rgba(var(--brand-rgb),.13);color:#fff;font-weight:600}
.wk-day.off{color:var(--text-3);border-style:dashed}
.wk-diary{list-style:none}
.wk-diary li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.wk-diary li:last-child{border-bottom:none}
.wk-diary .dd{flex:0 0 44px;font-size:11.5px;font-weight:700;color:var(--brand);padding-top:1px;font-variant-numeric:tabular-nums}
.wk-diary li{cursor:pointer;align-items:flex-start}
.wk-diary li:active{background:rgba(var(--brand-rgb),.07)}
.wk-diary .tt{flex:1 1 auto;min-width:0;font-size:12.5px;line-height:1.55;color:var(--text-2)}
.wk-diary .tt .sum{display:block}
.wk-diary .tt .sum.pending{color:var(--text-3)}
.wk-diary .more{flex:0 0 auto;font-size:11px;color:var(--brand);opacity:.9;padding-top:1px;white-space:nowrap}
/* 摘要没跑出来时的说明行：不然用户只能看到一个不动的「正在读原文」 */
.wk-sumfail{display:flex;align-items:center;gap:6px;margin:2px 2px 10px;
  font-size:11.5px;line-height:1.6;color:var(--text-3)}

// 全部用本地时间，避免 UTC 在东八区凌晨算错日期

/* ================= 图表 / 连续打卡 / 搜索（通用） ================= */
// 柱状图。rows: [{label, a, b?}]；dual=true 时 a/b 并排双色
// padTop：给顶部留白，最高那根柱子的数值标签才不会被切掉
function barChartSVG(rows, opt = {}) {
  const dual = !!opt.dual;
  const W = 340, H = opt.h || 118, padX = 8;
  const padTop = Math.max(0, opt.padTop || 0);
  const base = H - 26, avail = Math.max(4, base - padTop);
  const max = Math.max(1, ...rows.map(r => Math.max(Number(r.a) || 0, dual ? (Number(r.b) || 0) : 0)));
  const n = Math.max(1, rows.length);
  const slot = (W - padX * 2) / n;
  const bw = Math.min(dual ? 13 : 20, slot * (dual ? 0.36 : 0.5));
  const yOf = (v) => {
    const raw = (Math.max(0, Number(v) || 0) / max) * avail;
    const h = raw > 0 ? Math.max(2, raw) : 0;
    return { h, y: base - h };
  };
  let out = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">`;
  out += `<line x1="${padX}" y1="${base}" x2="${W - padX}" y2="${base}" stroke="rgba(255,255,255,.10)" stroke-width="1"/>`;
  rows.forEach((r, i) => {
    const cx = padX + slot * i + slot / 2;
    const A = yOf(r.a);
    if (dual) {
      const B = yOf(r.b);
      if (A.h) out += `<rect x="${(cx - bw - 1.5).toFixed(1)}" y="${A.y.toFixed(1)}" width="${bw.toFixed(1)}" height="${A.h.toFixed(1)}" rx="3" fill="var(--out)"/>`;
      if (B.h) out += `<rect x="${(cx + 1.5).toFixed(1)}" y="${B.y.toFixed(1)}" width="${bw.toFixed(1)}" height="${B.h.toFixed(1)}" rx="3" fill="var(--in)"/>`;
    } else if (A.h) {
      out += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${A.y.toFixed(1)}" width="${bw.toFixed(1)}" height="${A.h.toFixed(1)}" rx="3" fill="${opt.color || 'var(--brand)'}"/>`;
    }
    out += `<text x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="9.5" fill="var(--text-3)">${escapeHtml(r.label)}</text>`;
    if (opt.showVal && Number(r.a) > 0) {
      out += `<text x="${(dual ? cx - bw / 2 - 1.5 : cx).toFixed(1)}" y="${(A.y - 3).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="var(--text-3)">${escapeHtml(opt.fmt ? opt.fmt(r.a) : String(r.a))}</text>`;
    }
  });
  return out + '</svg>';
}

// 横向条形列表：rows [{label, v}]，右侧显示 fmt(v, pct)
function hbarList(rows, opt = {}) {
  const max = Math.max(1, ...rows.map(r => Number(r.v) || 0));
  const total = rows.reduce((s, r) => s + (Number(r.v) || 0), 0);
  return '<div class="bar-stack">' + rows.map(r => {
    const v = Math.max(0, Number(r.v) || 0);
    const pct = total ? (v / total * 100) : 0;
    return `<div class="bar-row">
      <span class="nm">${escapeHtml(r.label)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${(v / max * 100).toFixed(1)}%"></span></span>
      <span class="vl">${escapeHtml(opt.fmt ? opt.fmt(v, pct) : String(v))}</span>
    </div>`;
  }).join('') + '</div>';
}

function dayGap(a, b) {
  const pa = String(a).split('-').map(Number), pb = String(b).split('-').map(Number);
  return Math.round((new Date(pb[0], pb[1] - 1, pb[2]) - new Date(pa[0], pa[1] - 1, pa[2])) / 86400000);
}
// 当前连续天数：今天没记就从昨天算（今天仍有机会续上）
function currentStreak(set) {
  if (!set || !set.size) return 0;
  const d = new Date();
  if (!set.has(localDateStr(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(localDateStr(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function longestStreak(set) {
  const arr = [...(set || [])].sort();
  let best = 0, cur = 0, prev = null;
  arr.forEach(s => {
    cur = (prev && dayGap(prev, s) === 1) ? cur + 1 : 1;
    if (cur > best) best = cur;
    prev = s;
  });
  return best;
}
const MILESTONES = [3, 7, 14, 30, 100];

// 截取匹配位置附近的片段，让搜索结果看得见关键词上下文
function excerpt(text, q, len = 72) {
  const t = String(text || '');
  if (!q) return t.slice(0, len).replace(/\n/g, ' ');
  const i = t.toLowerCase().indexOf(String(q).toLowerCase());
  if (i < 0) return t.slice(0, len).replace(/\n/g, ' ');
  const s = Math.max(0, i - 18);
  return (s > 0 ? '…' : '') + t.slice(s, s + len).replace(/\n/g, ' ') + ((s + len) < t.length ? '…' : '');
}

// 搜索高亮：先转义再替换，避免注入
function highlight(text, q) {
  const t = escapeHtml(text || '');
  const k = (q || '').trim();
  if (!k) return t;
  const esc = escapeHtml(k).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try { return t.replace(new RegExp(esc, 'gi'), m => `<mark>${m}</mark>`); } catch (e) { return t; }
}

// 汇总「哪些天有过记录」——用于连续打卡
async function fetchActiveDays() {
  const d = new Date(); d.setDate(d.getDate() - 120);
  const since = localDateStr(d);
  const names = ['expense', 'diary', 'life', 'sport', 'health', 'steps'];
  const res = await Promise.all(names.map(t =>
    cloud.database.from(t).select('record_date').gte('record_date', since).limit(5000)
      .then(r => ({ data: r.data, error: r.error }), e => ({ data: null, error: e }))
  ));
  const set = new Set();
  res.forEach(r => (r.data || []).forEach(x => { if (x && x.record_date) set.add(String(x.record_date).slice(0, 10)); }));
  return set;
}

async function resolveAvatarURL() {
  avatarURL = '';
  try {
    const r = await cloud.storage.createSignedUrl(avatarStoragePath(), 3600);
    avatarURL = (r && r.data && r.data.signedUrl) || '';
  } catch (e) { avatarURL = ''; }
}
// 启动时：先用本机缓存秒出，再对齐云端
async function loadAvatar() {
  avatarVal = LS.get('avatar', '') || '';
  if (avatarVal === 'upload') await resolveAvatarURL();
  try {
    const r = await cloud.database.from('profile').select('avatar').limit(1).maybeSingle();
    if (r && !r.error && r.data) {
      const v = r.data.avatar || '';
      if (v !== avatarVal) {
        avatarVal = v;
        LS.set('avatar', v);
        if (v === 'upload') await resolveAvatarURL(); else avatarURL = '';
      }
    }
  } catch (e) { /* 表不可用时保持本机缓存 */ }
  paintAvatar();
}
async function setAvatar(v) {
  const prev = avatarVal;
  avatarVal = v;
  if (v === 'upload') await resolveAvatarURL(); else avatarURL = '';
  LS.set('avatar', v);
  const q = await cloud.database.from('profile').select('id').limit(1).maybeSingle();
  const row = (q && !q.error && q.data) || null;
  const res = row && row.id
    ? await cloud.database.from('profile').update({ avatar: v, updated_at: new Date().toISOString() }).eq('id', row.id).select()
    : await cloud.database.from('profile').insert({ avatar: v }).select();
  if (res.error) { avatarVal = prev; LS.set('avatar', prev); paintAvatar(); throw res.error; }
  paintAvatar();
}
// 居中裁成正方 + 缩小，避免把原图（可能几 MB）直接传上去
function squareBlob(file, size) {
  return new Promise((resolve, reject) => {
    const u = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const s = Math.min(img.width, img.height);
        const sx = (img.width - s) / 2;
        const sy = Math.max(0, Math.min(img.height - s, (img.height - s) * 0.18)); // 略偏上，保住脸
        const cv = document.createElement('canvas');
        cv.width = cv.height = size;
        cv.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
        cv.toBlob(b => { URL.revokeObjectURL(u); b ? resolve(b) : reject(new Error('图片处理失败')); }, 'image/webp', 0.92);
      } catch (e) { URL.revokeObjectURL(u); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(u); reject(new Error('图片读取失败，换一张试试')); };
    img.src = u;
  });
}
// 头像变了只刷新受影响的地方：顶栏/我的页头像就地重画。
// 不要用 renderApp()+switchTab() —— renderApp 内部的 renderHome() 是异步的，
// 会在之后完成并把 #view 覆盖掉，导致跳转失效（踩过）。
function afterAvatarChanged() {
  closeModal();
  paintAvatar();
  if (activeTab === 'me') renderProfile();
}
async function uploadAvatar(file) {
  if (avatarBusy) return;
  avatarBusy = true;
  try {
    if (!file || !/^image\//.test(file.type || '')) throw new Error('请选择图片文件');
    if (file.size > 12 * 1024 * 1024) throw new Error('图片太大，请选 12MB 以内的');
    const blob = await squareBlob(file, 256);
    const res = await cloud.storage.upload(avatarStoragePath(), blob, {
      contentType: blob.type || 'image/webp', cacheControl: '3600', upsert: true
    });
    if (res.error) throw res.error;
    await setAvatar('upload');
    afterAvatarChanged();
    toast('头像已更新', '已存到云端，换设备登录也在');
  } catch (e) {
    toastErr(e && e.message ? e.message : '上传失败，检查网络后重试');
    paintAvatar();
  } finally { avatarBusy = false; }
}
function openAvatarPicker() {

  openModal(`
    <div class="av-grid">
      <label class="av-opt file-pick ${up ? 'on' : ''}" id="av-up">

      <button class="av-opt ${avatarVal === 'skin:' + s.id ? 'on' : ''}" data-skin="${s.id}">
        <div class="av-thumb"><img src="${skinAvatarSrc(s.id)}" alt="" style="object-position:50% 20%"></div>
        <div class="av-name">${s.name}</div>

    </div>
    <div class="note" style="text-align:left;padding:12px 2px 8px">
      上传的图片会压成 256×256 存进云端文件（原图不上传），换设备登录也在；选伙伴皮肤直接借立绘，不占空间。
    </div>
    ${avatarVal ? '<button class="btn-ghost danger" id="av-reset">恢复默认（邮箱首字母）</button>' : ''}`);
  setModalTitle('我的头像');
  // 这里不再用 $('#av-up').onclick = () => input.click()：
  // 铺满整块区域的透明 input 自己就会吃到点击，走的是浏览器原生激活路径，最稳。
  const avIn = $('#av-file');

  watchFilePick(avIn);
  $$('.av-opt[data-skin]').forEach(b => b.onclick = async () => {
    try { await setAvatar('skin:' + b.dataset.skin); afterAvatarChanged(); toast('头像已更新', '用的是伙伴立绘'); }

  const rs = $('#av-reset');
  if (rs) rs.onclick = async () => {
    try {
      const p = avatarStoragePath();
      await setAvatar('');
      if (p) { try { await cloud.storage.remove([p]); } catch (e) {} }
      afterAvatarChanged(); toast('已恢复默认头像');
    } catch (e) { toastErr(errMsg(e)); }
  };
}

function applyTheme(id) {
  document.documentElement.dataset.theme = THEMES.some(t => t.id === id) ? id : 'aurora';
  const hex = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim();
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta && hex) meta.setAttribute('content', hex);
}
const getNick = () => (LS.get('nick', '') || '').trim();
const greeting = () => {
  const h = new Date().getHours();
  if (h < 6) return '夜深了'; if (h < 11) return '早上好';
  if (h < 14) return '中午好'; if (h < 18) return '下午好';
  if (h < 23) return '晚上好'; return '夜深了';
};
// 记账分类：内置 + 用户自定义追加
const BASE_CATS = ['餐饮','交通','购物','日用','住房','医疗','娱乐','学习','社交','人情','其他'];
const getCats = () => BASE_CATS.concat(LS.get('cats', []).filter(c => !BASE_CATS.includes(c)));

function countdown(btn) {
  let n = 60;
  const orig = btn.textContent;
  btn.disabled = true;
  const t = setInterval(() => {
    n--;
    btn.textContent = n + 's';
    if (n <= 0) { clearInterval(t); btn.disabled = false; btn.textContent = orig; }
  }, 1000);
}

/* ================= Init ================= */
function initCloud() {
  if (window.WorkBuddyCloud) {
    cloud = WorkBuddyCloud.createWorkBuddyCloud({
      endpoint: publicConfig.endpoint,
      publishableKey: publicConfig.publishableKey
    });
    return true;
  }
  return false;
}

async function boot() {
  applyTheme(LS.get('theme', 'aurora'));
  // 手机快捷指令带来的 ?steps=8321：先收下，等登录后自动落库
  const sp = readStepsParam();
  if (sp) { state.pendingSteps = sp; LS.set('pendingSteps', sp); clearStepsParam(); }
  let tries = 0;
  while (!initCloud() && tries < 50) { await sleep(100); tries++; }
  if (!cloud) {
    $('#root').innerHTML = '<div class="empty" style="padding-top:80px">SDK 加载失败，请检查网络后刷新</div>';
    return;
  }
  try {
    const { data: session } = await cloud.auth.getSession();
    if (session && session.user) { currentUser = session.user; renderApp(); return; }
  } catch(e) { console.warn('getSession', e); }
  renderLogin();
  cloud.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      currentUser = null;
      ['expense','diary','life','sport','health'].forEach(k => state[k] = []);
      renderLogin();
    } else if (session && session.user) {
      currentUser = session.user;
      renderApp();
    }
  });
}

/* ================= 弹窗/输入的小工具 ================= */

/* 手机键盘弹起来时，弹窗要跟着让位 —— 否则输入框正好被键盘盖住，
   写完看不到自己打了什么。visualViewport 是唯一能拿到键盘真实高度的接口。 */
(function bindKeyboardInset() {
  const vv = window.visualViewport;
  if (!vv) return;
  const fit = () => {
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', Math.round(kb) + 'px');
  };
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', fit);
  fit();
})();

/* 正文框自动长高：内容多了自己往上撑，到半屏就停住改内部滚动 */
function bindAutoGrow(ta) {
  if (!ta) return;
  const cap = () => Math.round(window.innerHeight * 0.5);
  const fit = () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight + 4, cap()) + 'px';
  };
  ta.addEventListener('input', fit);
  fit();
}

/* 「选择文件」点下去如果**系统选择器压根没弹**，页面会安静地停在原地，
   用户只能得出「点了没反应」这个结论。这里做一次探测并直说原因：
   2 秒内页面既没被切走、也没等到 change ⇒ 基本可以断定是 App 壳里
   没有实现 onShowFileChooser（低于 1.4 的版本就是这样）。 */
function watchFilePick(input) {
  if (!input) return;
  let changed = false, away = false;
  input.addEventListener('change', () => { changed = true; });
  window.addEventListener('blur', () => { away = true; }, { once: true });
  input.addEventListener('click', () => {
    changed = false; away = false;
    setTimeout(() => {
      if (changed || away || !document.hasFocus()) return;   // 有动静 = 正常
      if (input.files && input.files.length) return;
      if (LS.get('fileHint', 0)) return;                     // 只烦一次
      LS.set('fileHint', 1);
      showSyncBar('文件选择器没弹出来',
        '装的是旧版应用 —— 到「健康 → 手机步数同步」里重新下载安装包即可；网页版不受影响',
        9000, openStepSync);
    }, 2000);
  });
}

const CHECKIN_BASE = 20;   // 每日签到基础经验
const RECORD_EXP = 5;      // 当天每记一条记录的经验
const RECORD_CAP = 4;      // 每天最多计 4 条
const expNeed = (lv) => 40 + (lv - 1) * 20;
const expTotalFor = (lv) => { let s = 0; for (let i = 1; i < lv; i++) s += expNeed(i); return s; };
const levelOf = (exp) => { let lv = 1; while (lv < 99 && exp >= expTotalFor(lv + 1)) lv++; return lv; };
const formOf = (lv) => { let f = PET_FORMS[0]; PET_FORMS.forEach(x => { if (lv >= x.lv) f = x; }); return f; };
const moodLabel = (m) => m >= 85 ? '元气满满' : m >= 60 ? '心情不错' : m >= 35 ? '有点蔫' : '想你了';
const clampNum = (v, a, b) => Math.max(a, Math.min(b, Number(v) || 0));
const streakBonus = (n) => Math.min(25, Math.floor(n / 7) * 5);

// 截止到某一天的连续天数
function streakEndingAt(set, endStr) {
  const p = String(endStr).split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  let n = 0;
  while (set.has(localDateStr(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

let petBusy = false;
async function ensurePet(force) {
  if (!currentUser) return null;
  if (!force && state.pet && state.petLoadedDate === todayStr()) return state.pet;
  if (petBusy) return state.pet;
  petBusy = true;
  try {
    const today = todayStr();
    let { data: pet } = await cloud.database.from('pet').select('*').limit(1).maybeSingle();
    if (!pet) {
      const ins = await cloud.database.from('pet').insert({ name: '爱弥斯' }).select();
      pet = (ins.data && ins.data[0]) || { id: null, name: '爱弥斯', exp: 0, mood: 80, last_checkin: null };
    }
    const [chkRes, histRes] = await Promise.all([
      cloud.database.from('checkin').select('*').eq('record_date', today).limit(1).maybeSingle(),
      cloud.database.from('checkin').select('record_date').limit(LIMIT_LIST)
    ]);
    const chk = chkRes && !chkRes.error ? chkRes.data : null;
    const days = new Set(((histRes && histRes.data) || []).map(r => String(r.record_date).slice(0, 10)));

    if (!chk) {
      // 今天还没签 —— 自动签
      const y = new Date(); y.setDate(y.getDate() - 1);
      const streak = streakEndingAt(days, localDateStr(y)) + 1;
      const gain = CHECKIN_BASE + streakBonus(streak);
      let mood = clampNum(pet.mood == null ? 80 : pet.mood, 15, 100);
      if (pet.last_checkin) {
        const gap = dayGap(String(pet.last_checkin).slice(0, 10), today);
        if (gap > 1) mood -= Math.min(60, (gap - 1) * 15);
      }
      mood = Math.round(clampNum(mood + 8, 15, 100));
      const beforeLv = levelOf(Number(pet.exp || 0));
      const exp = Number(pet.exp || 0) + gain;
      const afterLv = levelOf(exp);
      if (pet.id) {
        await cloud.database.from('pet')
          .update({ exp, mood, last_checkin: today, updated_at: new Date().toISOString() })
          .eq('id', pet.id).select();
      }
      const insC = await cloud.database.from('checkin').insert({ record_date: today, exp: gain }).select();
      pet = Object.assign({}, pet, { exp, mood, last_checkin: today });
      days.add(today);
      state.todayCheckin = (insC.data && insC.data[0]) || { record_date: today, exp: gain, record_count: 0 };
      state.streakNow = streak;
      state.justChecked = { gain, streak, levelUp: afterLv > beforeLv, level: afterLv, form: formOf(afterLv) };
    } else {
      state.todayCheckin = chk;
      state.streakNow = streakEndingAt(days, today);
    }
    state.pet = pet;
    state.checkinDays = days;
    state.petLoadedDate = today;
    return pet;
  } catch (e) {
    console.warn('ensurePet failed', e);
    return state.pet;
  } finally {
    petBusy = false;
  }
}

// 保存一条记录后给伙伴加经验（每天最多计 4 条）
async function awardRecordExp() {
  const c = state.todayCheckin, pet = state.pet;
  if (!c || !pet || !pet.id || !c.id) return;
  const used = Number(c.record_count || 0);
  if (used >= RECORD_CAP) return;
  const beforeLv = levelOf(Number(pet.exp || 0));
  c.record_count = used + 1;
  const exp = Number(pet.exp || 0) + RECORD_EXP;
  pet.exp = exp;
  state.pet = pet;
  const afterLv = levelOf(exp);
  try {
    await Promise.all([
      cloud.database.from('checkin').update({ record_count: c.record_count }).eq('id', c.id).select(),
      cloud.database.from('pet').update({ exp, updated_at: new Date().toISOString() }).eq('id', pet.id).select()
    ]);
  } catch (e) { /* 经验加不上不影响记录本身 */ }
  if (afterLv > beforeLv) {
    toast(`升级了！Lv.${afterLv}`, `${pet.name || '爱弥斯'} ${formOf(afterLv).tip}`, petImg(formOf(afterLv)));
  } else {
    toast(`+${RECORD_EXP} 经验`, `${pet.name || '爱弥斯'} 看着你记完了`);
  }
}

// 顶部轻提示
/* 顶部提示条（toast / 同步结果条）左右一划就移除，不用干等它自己消失。
   两处细节：① toast 会被反复重建、sync-bar 每次都是新元素，所以监听挂在 document 上，
   用 contains 判定手指落在谁身上；② 先判主方向，竖着划要留给页面滚动，别抢。 */
(function () {
  const targets = [
    { get: () => { const t = document.getElementById('toast'); return (t && t.classList.contains('show')) ? t : null; },
      at: (d) => `translate(calc(-50% + ${d}px),calc(var(--safe-top) + 66px))` },
    { get: () => document.querySelector('.sync-bar.show'),
      at: (d) => `translate(${d}px,0)` }
  ];
  let cur = null, x0 = 0, y0 = 0, dx = 0, axis = '', live = false;

  document.addEventListener('touchstart', (e) => {
    cur = null;
    for (const it of targets) {
      const el = it.get();
      if (el && el.contains(e.target)) { cur = { el, at: it.at }; break; }
    }
    if (!cur) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    dx = 0; axis = ''; live = true;
    cur.el.style.transition = 'none';
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!live || !cur) return;
    const cx = e.touches[0].clientX - x0, cy = e.touches[0].clientY - y0;
    if (!axis) {
      if (Math.abs(cx) < 8 && Math.abs(cy) < 8) return;      // 手指还没走够，先不定方向
      axis = Math.abs(cx) > Math.abs(cy) ? 'x' : 'y';
      if (axis === 'y') {                                    // 竖划 = 想滚页面，让开
        live = false; cur.el.style.transition = ''; cur = null; return;
      }
    }
    dx = cx;
    cur.el.style.transform = cur.at(dx);
    cur.el.style.opacity = String(Math.max(.2, 1 - Math.abs(dx) / 260));
  }, { passive: true });

  const finish = (cancelled) => {
    if (!live || !cur) { if (cur) cur.el.style.transition = ''; live = false; cur = null; return; }
    const el = cur.el, at = cur.at, d = dx;
    live = false; cur = null; dx = 0;
    el.style.opacity = '';
    if (!cancelled && Math.abs(d) > 56) {                    // 划过阈值 = 顺势滑出屏幕再摘掉
      el.style.transition = 'transform .2s ease, opacity .2s ease';
      el.style.transform = at(d > 0 ? 460 : -460);
      el.style.opacity = '0';
      el.classList.remove('show');
      setTimeout(() => { if (el.parentNode) el.remove(); }, 220);
    } else {                                                 // 没过阈值 = 回弹
      el.style.transition = '';
      el.style.transform = '';
    }
  };
  document.addEventListener('touchend', () => finish(false), { passive: true });
  document.addEventListener('touchcancel', () => finish(true), { passive: true });
})();

let toastTimer = null, toastGoneTimer = null;
function toast(text, sub, img, kind) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  const exp = Number((state.pet && state.pet.exp) || 0);
  const err = kind === 'err';
  el.classList.toggle('err', err);          // 用 classList 而不是重写 className，免得把正在显示的 .show 抹掉
  el.innerHTML = err
    ? `<span class="ti">!</span><div class="tt">${escapeHtml(text)}${sub ? `<i>${escapeHtml(sub)}</i>` : ''}</div>`
    : `<img src="${img || petImg(formOf(levelOf(exp)))}" alt=""><div class="tt">${escapeHtml(text)}${sub ? `<i>${escapeHtml(sub)}</i>` : ''}</div>`;
  el.style.transition = ''; el.style.transform = ''; el.style.opacity = '';   // 清掉上次左右滑动留下的内联位移
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer); clearTimeout(toastGoneTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('show');
    // 收起动画跑完就从 DOM 里摘掉。别指望"靠定位把隐藏态挪出屏幕"——
    // 只要算差一点，屏幕顶端就会永远留一条小尾巴，只有刷新页面才消失。
    toastGoneTimer = setTimeout(() => {
      if (el.parentNode && !el.classList.contains('show')) el.remove();
    }, 380);
  }, 2800);
}

/* ---------- 网络状态：断网时顶部压一条，别让人对着转圈干等 ---------- */
(function bindNetStatus() {
  const bar = document.getElementById('net-bar');
  if (!bar) return;
  const apply = (off) => {
    bar.classList.toggle('on', off);
    // 先切 class 再量高度：display:none 的时候 offsetHeight 是 0
    document.documentElement.style.setProperty('--neth', off ? bar.offsetHeight + 'px' : '0px');
  };
  window.addEventListener('online',  () => { apply(false); toast('网络已恢复'); });
  window.addEventListener('offline', () => apply(true));
  window.addEventListener('resize',  () => apply(navigator.onLine === false));  // 横竖屏切换后安全区变了
  apply(navigator.onLine === false);
  // 真实 offline 事件在无头浏览器里造不出来，留个钩子给本地验证脚本用
  window.__netStatus = apply;
})();

        `连续签到 ${j.streak} 天 · ${j.form.name}`, petImg(j.form));

}

function quickAdd(act) {
  if (act === 'exp') { switchTab('expense'); setTimeout(() => openExpenseForm(), 60); }
  else if (act === 'dia') { switchTab('diary'); setTimeout(() => openDiaryForm(), 60); }
  else if (act === 'sp') { switchTab('sport'); setTimeout(() => openSportForm(), 60); }
  else if (act === 'he') { switchTab('health'); setTimeout(() => openHealthForm(), 60); }
}

/* ================= Expense ================= */
// 'YYYY-MM' → [本月1号, 下月1号) 开区间，任何月份都不会拼出非法日期
function rangeOfYM(ym) {
  const [y, m] = String(ym).split('-').map(Number);
  const next = new Date(y, m, 1); // m 为 1-based，Date 自动进位到下月 1 号
  return { start: `${pad2(y)}-${pad2(m)}-01`, end: `${next.getFullYear()}-${pad2(next.getMonth()+1)}-01` };
}
// 通用月份切换条：kind 决定它操作哪个模块
function ymBar(kind, ym) {
  const nowYM = monthStr();
  return `
    <div class="month-bar">
      <button class="month-nav" data-ym="${kind}" data-step="-1" aria-label="上个月">‹</button>
      <div class="month-cur num">${ym.slice(0,4)} 年 ${Number(ym.slice(5))} 月${ym === nowYM ? ' · 本月' : ''}</div>
      <button class="month-nav" data-ym="${kind}" data-step="1" aria-label="下个月"${ym >= nowYM ? ' disabled' : ''}>›</button>
    </div>`;
}
function monthBar(ym, mOut, mIn, outCnt, inCnt) {
  return ymBar('expense', ym) + `
    <div class="stat-grid">
      <div class="stat"><div class="label">支出</div><div class="value amt-out num">-¥${fmtMoney(mOut)}</div><div class="sub">${outCnt} 笔</div></div>
      <div class="stat"><div class="label">收入</div><div class="value amt-in num">+¥${fmtMoney(mIn)}</div><div class="sub">${inCnt} 笔</div></div>
    </div>`;
}
function shiftYM(ym, d) {
  let [y, m] = String(ym).split('-').map(Number);
  m += d;
  if (m < 1) { m = 12; y -= 1; } else if (m > 12) { m = 1; y += 1; }
  return `${y}-${pad2(m)}`;
}
const YM_KEY = { expense: 'expYM', health: 'heYM' };
function bindYM() {
  $$('[data-ym]').forEach(b => {
    if (b.disabled) return;
    b.onclick = () => {
      const kind = b.dataset.ym, key = YM_KEY[kind];
      const next = shiftYM(state[key] || monthStr(), Number(b.dataset.step));
      if (next > monthStr()) return; // 不允许翻到未来
      state[key] = next;
      if (kind === 'health') renderHealthList(); else renderExpenseList();
    };
  });
}

// 明细 / 图表 分段控件
const expSegHTML = () => `<div class="seg">
  <button id="seg-list" class="${state.expView === 'list' ? 'on' : ''}">${ICONS.list}明细</button>
  <button id="seg-chart" class="${state.expView === 'chart' ? 'on' : ''}">${ICONS.chart}图表</button>
</div>`;
function bindExpSeg() {
  const a = $('#seg-list'), b = $('#seg-chart');
  if (a) a.onclick = () => { state.expView = 'list'; renderExpenseList(); };
  if (b) b.onclick = () => { state.expView = 'chart'; renderExpenseList(); };
}

async function renderExpenseList() {
  const v = $('#view');
  if (state.expView === 'chart') return renderExpenseChart();
  if (!state.expYM) state.expYM = monthStr();
  const ym = state.expYM;

  // 这个月的旧数据已经画过 ⇒ 先把旧的摆上去（秒开），再后台拉最新的
  const cached = state.expenseSig && state.expenseYM === ym ? state.expense : null;
  if (cached) paintExpenseList();
  else v.innerHTML = loadingHTML();

  try {
    const { start, end } = rangeOfYM(ym);
    const { data, error } = await cloud.database.from('expense').select('*').gte('record_date', start).lt('record_date', end).order('record_date', { ascending: false }).order('created_at', { ascending: false });
    if (error) throw error;
    const list = data || [];
    const sig = rowsSig(list);
    const same = sig === state.expenseSig && state.expenseYM === ym;
    state.expense = list; state.expenseSig = sig; state.expenseYM = ym;
    if (!same) paintExpenseList();     // 数据没变就别重画，免得打断正在看列表的人
  } catch(e) {
    if (cached) softFail(e);
    else v.innerHTML = failHTML('加载', e, 'renderExpenseList()');
  }
}

/* 只负责画（数据取 state.expense）—— 秒开和刷新完成后都走它 */
function paintExpenseList() {
  const v = $('#view');
  const ym = state.expYM;
  let mOut = 0, mIn = 0;
  state.expense.forEach(r => { if (r.kind === 'out') mOut += Number(r.amount); else mIn += Number(r.amount); });
  if (!state.expense.length) {
    v.innerHTML = expSegHTML() + monthBar(ym, 0, 0, 0, 0) +
      `<div class="empty"><div class="ico">💰</div>${Number(ym.slice(5))} 月还没有记录<br>点右下角 + 记一笔</div>`;
    bindExpSeg(); bindYM();
    return;
  }
  const groups = {};
  state.expense.forEach(r => { const k = r.record_date; (groups[k] = groups[k] || []).push(r); });
  const sortedDays = Object.keys(groups).sort((a,b) => a < b ? 1 : -1);
  let html = expSegHTML() + monthBar(ym, mOut, mIn, state.expense.filter(r=>r.kind==='out').length, state.expense.filter(r=>r.kind==='in').length) + `<div class="sec">明细</div>`;
  sortedDays.forEach(day => {
    let dayOut = 0;
    groups[day].forEach(r => { if (r.kind === 'out') dayOut += Number(r.amount); });
    html += `<div class="card">
      <div class="row-between" style="margin-bottom:10px">
        <span class="dim" style="font-size:13px;font-weight:600">${fmtDate(day)}</span>
        <span class="muted" style="font-size:12px">${groups[day].length} 笔 · 支出 ¥${fmtMoney(dayOut)}</span>
      </div>`;
    groups[day].forEach(r => {
      const sign = r.kind === 'out' ? '-' : '+';
      const cls = r.kind === 'out' ? 'amt-out' : 'amt-in';
      html += `
        <div class="row card-tap" data-edit="expense" data-id="${r.id}" style="padding:8px 0">
          <span class="grow">
            <span class="dim">${escapeHtml(r.category||'-')}</span>
            ${r.note ? `<div class="muted" style="font-size:12px;margin-top:2px">${escapeHtml(r.note)}</div>` : ''}
          </span>
          <span class="${cls} num">${sign}¥${fmtMoney(r.amount)}</span>
          <button class="btn-close" data-del="expense" data-id="${r.id}" style="font-size:13px;width:26px;height:26px">×</button>
        </div>`;
    });
    html += `</div>`;
  });
  v.innerHTML = html;
  bindExpSeg(); bindYM();
  $$('[data-edit="expense"]').forEach(el => el.onclick = (e) => {
    if (e.target.dataset.del) return;
    openExpenseForm(el.dataset.id);
  });
  $$('[data-del="expense"]').forEach(b => b.onclick = (e) => { e.stopPropagation(); delExpense(b.dataset.id); });
}

/* ---- 记账图表：6 月趋势 + 分类构成 + 30 天节奏 ---- */
async function renderExpenseChart() {
  const v = $('#view');
  v.innerHTML = loadingHTML();
  try {
    const now = new Date();
    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const nx = new Date(d.getFullYear(), d.getMonth() + 1, 1);
      months.push({
        ym: monthStr(d), label: (d.getMonth() + 1) + '月',
        start: `${d.getFullYear()}-${pad2(d.getMonth()+1)}-01`,
        end: `${nx.getFullYear()}-${pad2(nx.getMonth()+1)}-01`
      });
    }
    const { data, error } = await cloud.database.from('expense').select('*')
      .gte('record_date', months[0].start).lt('record_date', months[months.length-1].end);
    if (error) throw error;
    const all = data || [];
    const inRange = (r, s, e) => String(r.record_date) >= s && String(r.record_date) < e;

    if (!all.length) {
      v.innerHTML = expSegHTML() + `<div class="empty"><div class="ico">📊</div>近半年还没有记账<br>记几笔就能看到趋势了</div>`;
      bindExpSeg();
      return;
    }

    // 1) 近 6 个月收支
    const rows = months.map(m => {
      const list = all.filter(r => inRange(r, m.start, m.end));
      let o = 0, i = 0;
      list.forEach(r => { if (r.kind === 'out') o += Number(r.amount); else i += Number(r.amount); });
      return { label: m.label, a: o, b: i, list, ym: m.ym };
    });

    // 2) 当前月份分类构成（只看支出）
    const curM = months[months.length - 1];
    const curList = all.filter(r => inRange(r, curM.start, curM.end) && r.kind === 'out');
    const catMap = {};
    curList.forEach(r => { const k = r.category || '未分类'; catMap[k] = (catMap[k] || 0) + Number(r.amount); });
    const catRows = Object.keys(catMap).map(k => ({ label: k, v: catMap[k] })).sort((a,b) => b.v - a.v);

    // 3) 近 30 天每日支出
    const d30 = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29);
    const dayRows = [];
    for (let i = 0; i < 30; i++) {
      const d = new Date(d30.getFullYear(), d30.getMonth(), d30.getDate() + i);
      const s = localDateStr(d);
      const sum = all.filter(r => String(r.record_date) === s && r.kind === 'out').reduce((a,r)=>a+Number(r.amount),0);
      dayRows.push({ label: (i % 5 === 0 || i === 29) ? (d.getMonth()+1) + '/' + d.getDate() : '', a: sum });
    }

    const totOut = curList.reduce((s,r)=>s+Number(r.amount),0);
    let html = expSegHTML();
    html += `<div class="chart-wrap">
      <div class="chart-title">近 6 个月 · 支出 vs 收入</div>
      ${barChartSVG(rows, { dual: true, h: 130 })}
      <div class="chart-legend"><span><i style="background:var(--out)"></i>支出</span><span><i style="background:var(--in)"></i>收入</span></div>
    </div>`;
    html += `<div class="sec">${Number(curM.ym.slice(5))} 月支出构成 · 共 ¥${fmtMoney(totOut)}</div>`;
    html += catRows.length
      ? `<div class="chart-wrap"><div class="chart-title">占比 Top ${Math.min(catRows.length, 8)}</div>${hbarList(catRows.slice(0, 8), { fmt: (v, p) => `¥${fmtMoney(v)} · ${p.toFixed(0)}%` })}</div>`
      : `<div class="chart-wrap"><div class="dim" style="font-size:12px;padding:4px">本月还没有支出记录</div></div>`;
    html += `<div class="sec">近 30 天每日支出</div>
      <div class="chart-wrap">
        <div class="chart-title">日均 ¥${fmtMoney(totOut ? dayRows.reduce((s,r)=>s+r.a,0) / 30 : 0)}</div>
        ${barChartSVG(dayRows, { h: 110, color: 'var(--brand)' })}
      </div>`;

    v.innerHTML = html;
    bindExpSeg();
  } catch(e) {
    v.innerHTML = failHTML('加载', e, 'renderExpenseChart()');
  }
}

      <select id="f-category">
        ${getCats().map(c=>`<option value="${c}" ${r&&r.category===c?'selected':''}>${c}</option>`).join('')}

async function saveExpense(id) {
  const amount = parseFloat($('#f-amount').value);
  if (!amount || amount <= 0) { toastErr('请填正确金额'); return; }
  const payload = {
    amount, kind: $('#f-kind').value, category: $('#f-category').value,
    note: $('#f-note').value.trim(), record_date: $('#f-date').value
  };
  const res = id
    ? await cloud.database.from('expense').update(payload).eq('id', id).select()
    : await cloud.database.from('expense').insert(payload).select();
  if (res.error) { toastErr(errMsg(res.error)); return; }
  closeModal();
  if (!id) awardRecordExp();
  // 记到别的月份时自动跟过去，避免「保存完看不到」
  const ym = payload.record_date ? payload.record_date.slice(0,7) : null;
  if (ym && ym !== state.expYM && ym <= monthStr()) state.expYM = ym;
  renderExpenseList();
}

async function delExpense(id) {
  if (!confirm('删除这条记录？')) return;
  const { error } = await cloud.database.from('expense').delete().eq('id', id).select();
  if (error) { toastErr(errMsg(error)); return; }
  renderExpenseList();
}

const MOODS = ['😊','😢','😡','😐','😴','🥰','😰','🤔','💪','🎉'];

async function renderDiaryList() {
  const v = $('#view');
  // 有旧数据就先把旧的摆上去（秒开），再后台拉最新的。
  // ⛔ 已经站在日记页、搜索框也建好了 ⇒ 绝不能走 paintDiaryAll ——
  //    它会重建整个 #view（连输入框一起换掉），正在拼的中文就没落点了。
  //    #dq 不存在只可能是"刚从别的 tab 切过来"（各 tab 共用 #view，DOM 早被冲了）。
  const cached = state.diarySig ? state.diary : null;
  if (cached) { if (state.diary.length && $('#dq')) paintDiaryList(); else paintDiaryAll(); }
  else v.innerHTML = loadingHTML();

  try {
    const { data, error } = await cloud.database.from('diary').select('*').order('record_date', { ascending: false }).order('created_at', { ascending: false }).limit(LIMIT_LIST);
    if (error) throw error;
    const list = data || [];
    const sig = rowsSig(list);
    const same = sig === state.diarySig;
    state.diary = list; state.diarySig = sig;
    if (!same) {
      // ⛔ 搜索框已经建好就只重画列表。重建整个 #view 会把正在拼的中文打断
      //    （「打出来只有字母、上不了屏」那个老 bug 就是这么来的）
      if (state.diary.length && $('#dq')) paintDiaryList();
      else paintDiaryAll();
    }
  } catch(e) {
    if (cached) softFail(e);
    else v.innerHTML = failHTML('加载', e, 'renderDiaryList()');
  }
}

/* 建搜索框 + 列表。只在「第一次进来」和「列表变空」时跑，
   之后一律只调 paintDiaryList()，别再重建输入框。 */
function paintDiaryAll() {
  const v = $('#view');
  if (!state.diary.length) {
    v.innerHTML = `<div class="empty"><div class="ico">📖</div>还没有日记<br>点右下角 + 写第一篇</div>`;
    return;
  }
  /* 搜索框只建这一次，之后打字只重画下面的 #dq-list。
     ⛔ 以前是「每次输入都重建整个 #view」—— 连输入框本身一起换掉，
     中文输入法正在拼的那串拼音就没了落点，表现成「打出来只有字母、上不了屏」。
     另外 type="search" 在部分安卓输入法下会吃回车/候选键，换成 text + inputmode。 */
  v.innerHTML = `<div class="search">
    <span class="si">${ICONS.search}</span>
    <input id="dq" type="text" inputmode="search" enterkeyhint="search" autocomplete="off"
           placeholder="搜标题 / 正文 / 心情 / 日期" value="${escapeHtml(state.diaryQ || '')}">
    <span class="clr" id="dq-clr" style="${state.diaryQ ? '' : 'display:none'}">×</span>
  </div>
  <div id="dq-list"></div>`;

  const dq = $('#dq');
  let composing = false;                       // 输入法拼字中，先别动 DOM
  dq.addEventListener('compositionstart', () => { composing = true; });
  dq.addEventListener('compositionend', (e) => { composing = false; state.diaryQ = e.target.value; paintDiaryList(); });
  dq.addEventListener('input', (e) => {
    state.diaryQ = e.target.value;
    $('#dq-clr').style.display = state.diaryQ ? '' : 'none';
    if (composing || e.isComposing) return;
    paintDiaryList();
  });
  $('#dq-clr').onclick = () => {
    state.diaryQ = ''; dq.value = '';
    $('#dq-clr').style.display = 'none';
    paintDiaryList(); dq.focus();
  };
  paintDiaryList();
}

/* ================= Life ================= */

/* 标签池 = 自己加过的（存本地） → 历史用过的（按出现次数） → 预设常用。
   做成点选的 chips：手机上打「逗号」本身就很别扭，而且打出来的词每次还不一样。 */
const LIFE_TAG_PRESETS = ['朋友','家人','工作','学习','日记','美食','旅行','游戏','心情','护肤','早起','练枪'];
const LIFE_TAG_KEY = 'lifeTags';
/* 「管理」里删掉的标签记在这里。
   ⛔ 不能只从 lifeTags 里删：历史记录里用过的词会被 freq 分支重新捞回候选池，
      所以必须有一份"黑名单"，在最后统一过滤（池子和筛选条都过一遍）。 */
const LIFE_TAG_HIDE_KEY = 'lifeTagsHidden';

function lifeTagHidden() {
  const a = LS.get(LIFE_TAG_HIDE_KEY, []);
  return Array.isArray(a) ? a.map(String) : [];
}
function hideLifeTag(t) {
  const list = lifeTagHidden();
  if (!list.includes(t)) { list.unshift(t); LS.set(LIFE_TAG_HIDE_KEY, list.slice(0, 200)); }
  const custom = (LS.get(LIFE_TAG_KEY, []) || []).map(String).filter(x => x !== t);
  LS.set(LIFE_TAG_KEY, custom);
}
function unhideLifeTag(t) {
  const list = lifeTagHidden();
  if (list.includes(t)) LS.set(LIFE_TAG_HIDE_KEY, list.filter(x => x !== t));
}

function lifeTagPool() {
  const hidden = lifeTagHidden();
  const custom = (LS.get(LIFE_TAG_KEY, []) || []).map(String);
  const freq = {};
  (state.life || []).forEach(r => (r.tags || []).forEach(t => {
    const s = String(t).trim(); if (s) freq[s] = (freq[s] || 0) + 1;
  }));
  const used = Object.keys(freq).sort((a, b) => freq[b] - freq[a]).slice(0, 18);
  const out = [];
  custom.concat(used, LIFE_TAG_PRESETS).forEach(t => {
    const s = String(t).trim();
    if (s && s.length <= 12 && !out.includes(s) && !hidden.includes(s)) out.push(s);
  });
  return out.slice(0, 36);
}

/* ================= Sport ================= */
const SPORT_TYPES = ['跑步','散步','力量','瑜伽','骑行','球类','游泳','健身操','其他'];

/* ---- 步数折算（距离 / 消耗）------------------------------------------------
   手机只肯把「步数」交给 App（TYPE_STEP_COUNTER）。距离、消耗、爬楼、心率
   都是手机自带健康 App 的私有数据，普通 App 读不到（要厂商签名级权限，
   或走系统的 Health Connect 授权——那个得看你手机支不支持）。
   所以这里只能按步数折算，默认值取自常见经验：步幅 0.8 米、每步每公斤约
   0.00053 千卡（72 公斤的人约 0.038 千卡/步，与手机健康 App 的量级一致）。
   ⛔ 界面上必须写清「估算」，别让用户以为这是手机量出来的。                 */
function stepStrideM() { const v = Number(LS.get('stepStride', 0.8)); return (v > 0.3 && v < 1.6) ? v : 0.8; }
function stepWeightKg() { const v = Number(LS.get('bodyWeight', 72)); return (v > 20 && v < 200) ? v : 72; }
function stepSpm() { const v = Number(LS.get('stepSpm', 100)); return (v >= 60 && v <= 160) ? v : 100; }
function stepMetrics(steps) {
  const s = Math.max(0, Number(steps) || 0);
  return { km: s * stepStrideM() / 1000, kcal: Math.round(s * stepWeightKg() * 0.00053) };
}
// 步数 → 步行时长（分）。散步步频约 100 步/分，可在「调整折算」里改。
function stepMinutes(steps) { return Math.round(Math.max(0, Number(steps) || 0) / stepSpm()); }

/* ---- 运动量口径：手记优先，步数折算兜底 --------------------------------
   散步这类日常活动用户懒得填时长/距离/消耗（也确实没必要填），所以周汇总
   不能只看手记字段，否则永远是三个「未记录」。这里按「天」合并：
     某天手记填了 → 用那天手记的值；那天没填 → 用那天的步数折算。
   ⛔ 同一天只用一种来源，不做相加，避免手记和折算重复计算。
   ⛔ 折算出来的值必须标「估算」，不能和手记实测混为一谈。 */
function dayLoad(sportRows, stepRows) {
  const d = {};
  const slot = (k) => d[k] || (d[k] = { mKm: 0, mKcal: 0, mMin: 0, steps: 0 });
  (sportRows || []).forEach(r => {
    const o = slot(ymd(r));
    o.mKm += Number(r.distance_km) || 0;
    o.mKcal += Number(r.calories) || 0;
    o.mMin += Number(r.duration_min) || 0;
  });
  (stepRows || []).forEach(r => { slot(ymd(r)).steps = Number(r.steps) || 0; });

  const keys = Object.keys(d).sort();
  keys.forEach(k => {
    const o = d[k], e = stepMetrics(o.steps);
    const pick = (m) => m > 0 ? 'm' : (o.steps > 0 ? 'e' : null);
    o.km = o.mKm > 0 ? o.mKm : e.km;
    o.kcal = o.mKcal > 0 ? o.mKcal : e.kcal;
    o.min = o.mMin > 0 ? o.mMin : stepMinutes(o.steps);
    o.src = { km: pick(o.mKm), kcal: pick(o.mKcal), min: pick(o.mMin) };
  });
  return d;
}
// 周合计 + 来源判定：'manual' 全是手记 / 'est' 全是步数估算 / 'mix' 两种都有 / 'none' 两样都没有
function loadSum(dayMap) {
  const days = Object.keys(dayMap).map(k => dayMap[k]);
  const tot = { km: 0, kcal: 0, min: 0 };
  days.forEach(o => { tot.km += o.km; tot.kcal += o.kcal; tot.min += o.min; });
  const src = {};
  ['km', 'kcal', 'min'].forEach(f => {
    const s = new Set(days.map(o => o.src[f]).filter(Boolean));
    src[f] = !s.size ? 'none' : (s.size > 1 ? 'mix' : [...s][0]);
  });
  return { ...tot, src, estDays: days.filter(o => o.src.km === 'e').length, days: days.length };
}
function stepExtraHTML(stepNow) {
  const m = stepMetrics(stepNow);
  return `<div class="step-extra">
    <span class="m"><i>距离 · 估算</i><b>${m.km.toFixed(2)}<em>km</em></b></span>
    <span class="m"><i>消耗 · 估算</i><b>${m.kcal}<em>千卡</em></b></span>
    <span class="adj"><button class="btn-text" id="step-metrics">调整折算 ›</button></span>
  </div>`;
}

/* 手机数据区（今日步数 + 近 14 天）。原来长在「健康」页，现在归「运动」——
   步数和运动记录本来就是一件事，分在两个页面看才叫重复。 */
function stepSectionHTML() {
  const today = todayStr();
  const list = state.steps || [];
  const stepToday = list.find(r => String(r.record_date) === today) || null;
  const goal = Number(stepToday && stepToday.goal) || Number(LS.get('stepGoal', 8000)) || 8000;
  const stepNow = stepToday ? Number(stepToday.steps) : 0;
  const pct = goal ? Math.min(100, stepNow / goal * 100) : 0;
  const rows = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const s = localDateStr(d);
    const rec = list.find(r => String(r.record_date) === s);
    rows.push({ label: (i % 2 === 0) ? (d.getMonth()+1) + '/' + d.getDate() : '', a: rec ? Number(rec.steps) : 0 });
  }
  const hitDays = rows.filter(r => r.a >= goal).length;
  const avgStep = Math.round(rows.reduce((s,r)=>s+r.a,0) / 14);
  return `
      <div class="sec">手机数据 · 自动同步</div>
      <div class="step-hero" id="step-hero">
        <div class="step-top">
          <div>
            <div class="hero-label">今日步数</div>
            <div class="step-num num">${stepNow.toLocaleString('zh-CN')}</div>
          </div>
          <div style="text-align:right">
            <div class="hero-label">每日目标</div>
            <div class="num" style="font-size:15px;font-weight:700;color:var(--text-2)">${goal.toLocaleString('zh-CN')}</div>
          </div>
        </div>
        <div class="step-track"><span class="step-fill" style="width:${pct.toFixed(1)}%"></span></div>
        <div class="step-hint">${stepNow >= goal ? `已达标 · 超出 ${(stepNow-goal).toLocaleString('zh-CN')} 步` : `还差 ${(goal-stepNow).toLocaleString('zh-CN')} 步达标`} · 点这里录入</div>
        ${stepExtraHTML(stepNow)}
        ${isInApp() ? `<div class="step-calib"><button class="btn-text" id="step-calib">自动同步的数字不对？校准今日步数 ›</button></div>` : ''}
      </div>
      <div class="sec">近 14 天步数</div>
      <div class="chart-wrap">
        <div class="chart-title">日均 ${avgStep.toLocaleString('zh-CN')} 步 · 达标 ${hitDays} 天</div>
        ${barChartSVG(rows, { h: 108, color: 'var(--cyan)' })}
      </div>`;
}

function paintSportList() {
  const v = $('#view');
  const now = new Date();
  const weekStartStr = localDateStr(mondayOf(now));   // 周一为一周起点，跟周报对齐
  const week = state.sport.filter(r => r.record_date >= weekStartStr);
  // 近 14 天每日时长
  const d14b = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 13);
  const dayRows = [];
  let tot14 = 0;
  for (let i = 0; i < 14; i++) {
    const d = new Date(d14b.getFullYear(), d14b.getMonth(), d14b.getDate() + i);
    const s = localDateStr(d);
    const m = state.sport.filter(r => String(r.record_date) === s).reduce((a,r)=>a+Number(r.duration_min||0),0);
    tot14 += m;
    dayRows.push({ label: (i % 2 === 0) ? (d.getMonth()+1) + '/' + d.getDate() : '', a: m });

  const sportDays = dayRows.filter(r => r.a > 0).length;
  // 运动量：手记优先、步数折算兜底（散步不用手填，具体见 dayLoad 注释）
  const load = loadSum(dayLoad(week, (state.steps || []).filter(r => String(r.record_date) >= weekStartStr)));
  const SRC_TXT = { m: '手记', e: '步数估算', mix: '手记 + 估算' };
  const cell = (label, v, unit, fix, key) => {

    return `<div class="stat"><div class="label">${label}</div><div class="value num">${txt}${u}</div>`
      + `<div class="sub">${has ? SRC_TXT[load.src[key]] : '无记录'}</div></div>`;
  };
  const loadNote = load.estDays
    ? `时长 / 距离 / 消耗没手填的按步数折算，本周覆盖 ${load.estDays} 天（步幅 ${stepStrideM()} 米、体重 ${stepWeightKg()} 公斤、步频 ${stepSpm()} 步/分）· 点「调整折算」可改`
    : (week.length ? '本周运动量全部来自手记明细' : '');

  let html = stepSectionHTML();
  html += `
    <div class="sec">本周汇总</div>
    <div class="stat-grid">
      ${cell('总时长', load.min, '分', 0, 'min')}

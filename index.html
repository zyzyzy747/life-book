<script src="sw.js"></script>
<script>
/* Service Worker：让 app.js/app.css 走浏览器本地缓存。
   ⛔ 托管不给 Cache-Control（实测 sdk 被打开4 次，每次都是全量 61KB 重传），
      缓存策略只能由 SW 自己定。实测二次打开这310KB + sdk 全部 0 字节传输。
   ⛔ 注册失败绝不能影响页面 —— 包 catch，SW 是优化不是依赖。
   ⛔ 不偷偷替换：装了新 SW 只提示「下次打开生效」，
      偷换会把用户正在填的表单重置，比不更新糟糕得多。*/
(function(){
  if (!('serviceWorker' in navigator)) return;

  /*⛔⛔⛔ 2026-10-19 修：安卓 App 里 WebView 长期存活，浏览器**几小时甚至一天
     才检查一次 SW 更新** ⇒ App 永远卡在旧版本（用户实测：App 里 v3.11，
     浏览器里已经是 v3.15）。
     ⇒ 每次打开都主动 reg.update() + 清掉旧缓存。
     ⛔ 不能偷偷 replace()：那会把用户正在填的表单重置。
        只在这里确保「下次打开就是新版」。*/
  window.addEventListener('load', function(){
    /* ⛔⛔⛔ swUrl 不能带时间戳（2026-10-20 修）。
       v3.16 我图省事写了 `'sw.js?u=' + Date.now()`，结果**每次打开都是新 URL**，
       浏览器每次都当成「有新 SW」⇒ skipWaiting + 重新预缓存 + 清旧缓存
       ⇒ 用户每次进 App 都看到「有新版本，下次打开生效」，
       而且刚加载的代码被反复替换 —— 正是「删除闪一下又回来、
       新加的重进就没」的直接原因。

       ⇒ 正确做法：**URL 稳定 + 只在内容变时才更新**。
         sw.js 里的 VER（v316）每次发版会变 ⇒ 字节变了浏览器自然会更新；
         reg.update() 负责去问一次有没有新的。
         绝不能靠改 query 制造「假更新」。*/
    var swUrl = 'sw.js';
    navigator.serviceWorker.register(swUrl).then(function(reg){
      // 主动检查更新（浏览器默认一天才查一次，App 里等不到）
      try { reg.update(); } catch (e) {}

      reg.addEventListener('updatefound', function(){
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function(){
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            if (window.toast) window.toast('有新版本', '下次打开生效，或下拉刷新立即更新');
          }
        });
      });
    }).catch(function(){/* 失败就算了 */});

    // ② 每次打开顺手把「旧版本缓存名」清掉。
    //    缓存名就是 sw.js 里的 VER（v315 这种）⇒ 认前缀 v\d+ 即可。
    //    正常情况下 activate 已经清过；这里兜底防「SW 压根没更新」的情况。
    if (window.caches && caches.keys) {
      caches.keys().then(function(keys){
        var live = keys.filter(function(k){ return /^v\d+$/.test(k); });
        if (live.length > 1) {
          Promise.all(live.slice(0, -1).map(function(k){ return caches.delete(k); }));
        }
      }).catch(function(){});
    }
  });
})();
</script>

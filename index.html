<script>
/* Service Worker：让 app.js/app.css 走浏览器本地缓存。
   ⛔ 托管不给 Cache-Control（实测 sdk 被打开4 次，每次都是全量 61KB 重传），
      缓存策略只能由 SW 自己定。实测二次打开这310KB + sdk 全部 0 字节传输。
   ⛔ 注册失败绝不能影响页面 —— 包 catch，SW 是优化不是依赖。
   ⛔ 不偷偷替换：装了新 SW 只提示「下次打开生效」，
      偷换会把用户正在填的表单重置，比不更新糟糕得多。*/
(function(){
  if (!('serviceWorker' in navigator)) return;

  /*⛔⛔⛔ 2026-10-19 修：安卓 App 里 WebView 长期存活，浏览器**几小时甚至一天
     才检查一次 SW 更新** ⇒ App 永远卡在旧版本（用户实测：App 里 v3.11，
     浏览器里已经是 v3.15）。
     ⇒ 每次打开都主动 reg.update() + 清掉旧缓存。
     ⛔ 不能偷偷 replace()：那会把用户正在填的表单重置。
        只在这里确保「下次打开就是新版」。*/
  window.addEventListener('load', function(){
    /* ⛔ sw.js 自己没版本号，浏览器可能连它都按缓存不发。
       加上时间戳当 query ⇒ 每次都是新URL ⇒ 一定回源拿最新的 sw.js。
       （配合 sw.js 里的 skipWaiting，新 SW 才会立刻夺权。）*/
    var swUrl = 'sw.js?u=' + Date.now();
    navigator.serviceWorker.register(swUrl).then(function(reg){
      // ① 主动检查更新（这是关键，浏览器默认不会频繁查）
      try { reg.update(); } catch (e) {}

      reg.addEventListener('updatefound', function(){
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function(){
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            if (window.toast) window.toast('有新版本', '下次打开生效，或下拉刷新立即更新');
          }
        });
      });
    }).catch(function(){/* 失败就算了 */});

    // ② 每次打开顺手把「旧版本缓存名」清掉。
    //    缓存名就是 sw.js 里的 VER（v315 这种）⇒ 认前缀 v\d+ 即可。
    //    正常情况下 activate 已经清过；这里兜底防「SW 压根没更新」的情况。
    if (window.caches && caches.keys) {
      caches.keys().then(function(keys){
        var live = keys.filter(function(k){ return /^v\d+$/.test(k); });
        if (live.length > 1) {
          Promise.all(live.slice(0, -1).map(function(k){ return caches.delete(k); }));
        }
      }).catch(function(){});
    }
  });
})();
</script>

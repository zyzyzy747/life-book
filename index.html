<script>
/* Service Worker：让 app.js/app.css 走浏览器本地缓存。
   ⛔ 托管不给 Cache-Control（实测 sdk 被打开4 次，每次都是全量 61KB 重传），
      缓存策略只能由 SW 自己定。实测二次打开这310KB + sdk 全部 0 字节传输。
   ⛔ 注册失败绝不能影响页面 —— 包 catch，SW 是优化不是依赖。
   ⛔ 不偷偷替换：装了新 SW 只提示「下次打开生效」，
      偷换会把用户正在填的表单重置，比不更新糟糕得多。*/
(function(){
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function(){
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            if (window.toast) window.toast('有新版本', '下次打开生效，或下拉刷新立即更新');
          }
        });
      });
    }).catch(function(){/* 失败就算了 */});
  });
})();
</script>
